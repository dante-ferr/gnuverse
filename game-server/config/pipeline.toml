# Open Pipeline v0.1 gameplay and presentation. Durations in ms unless noted. Colors are #RRGGBB.
# Flat keys only (no [pipeline] table). game:dev hot-reloads this file on save;
# invalid edits keep the previous rules. grid_width/height apply at room creation only.

# Simulation
tick_ms = 250 # Authoritative tick interval

# World grid (new rooms)
grid_width = 24
grid_height = 24

# Camera (client)
grid_visible_min_zoom = 0.5 # Show cell grid at or above this zoom (zoomed in)
camera_zoom_min = 0.08 # Zoomed out limit (see more map)
camera_zoom_max = 3 # Zoomed in limit
camera_enter_view_cells = 14 # Initial room visit: shorter viewport edge spans this many cells
# Scene LOD (client). At/above detail: glyphs, chevrons, full machines.
# Between structure and detail: element-fill disks, no chevrons, flat machine fills + cores.
# Below structure: disks, no chevrons, cores only (source/combiner glyphs still draw).
lod_detail_min_zoom = 0.3
lod_structure_min_zoom = 0

# Scene palette (cool charcoal + site teal / coral)
color_background = "#0e171d" # Playable floor; void outside chunks (= --scene)
color_grid = "#1f3038" # Cell lines when zoomed in
color_belt = "#667b83"
color_belt_chevron = "#3e5056"
color_packet = "#52d6c9" # Site teal
color_core = "#ffffff"
color_source = "#52d6c9"
color_splitter = "#c9a87c" # Warm sand logistic body
color_trashcan = "#8b6540" # Deeper brown; splitter is warm sand
color_tunnel = "#6d8490" # Cool slate portals
color_accent = "#52d6c9" # Site teal
color_decor = "#143a38" # = --accent-soft; machine decor darkened per body
decor_darken_percent = 35 # Decor darken amount (0–90)
outline_width_px = 3
color_outline = "#0a1014"
color_surface = "#152229"
color_muted = "#6a7b83"
color_highlight = "#86e7dd" # = --accent-hover
color_warning = "#ff8b7d" # Site coral
color_success = "#5ecf9a"
color_ink = "#2a3c44" # HUD copy (reserved)
decor_stroke_width = 28 # SVG units; sync with public/pipeline/*.svg

# Belts and animation
belt_chevron_stroke_px = 4
belt_chevron_flow_ms = 900 # Ms to move chevrons one cell
belt_speed_fast = 3 # Cells (or tunnel queue steps) per tick for fast conveyors/tunnels
color_fast_belt = "#667b83" # Track fill (same gray family as color_belt)
color_fast_belt_chevron = "#e85d4f" # Coral-red chevrons and side rails
belt_fast_chevron_flow_ms = 300 # Visual; ~1/3 of belt_chevron_flow_ms
belt_fast_chevron_arm_percent = 22 # Chevron arm length (% of one cell; normal uses ~14)
belt_fast_side_inset_percent = 10 # Side-rail inset from belt outer edge (% of one cell)
color_fast_tunnel = "#667b83" # Portal body (same gray as color_fast_belt); red details use color_fast_belt_chevron
tunnel_max_gap = 8 # Empty cells between portals (0 = adjacent; Factorio-style)

# Resource glyphs at sources / belts (no machine-footprint clamp — size can exceed the body)
resource_glyph_size_px = 48
# Machine overlays: above = screen-fixed (zoom in → small on machine); at/below = shrink with world.
# Lower keeps glyphs fixed longer while zooming out (they can outgrow the body a bit before shrinking).
resource_glyph_world_min_zoom = 0.2
resource_glyph_orbit_px = 4
resource_glyph_orbit_ms = 4000
# Outline mode: dual (outer+inner solid), single (one solid ring), blur (soft halo).
resource_glyph_outline_mode = "dual"
resource_glyph_outline_outer = "#000000"
resource_glyph_outline_inner = "#0a1014"
resource_glyph_outline_blur = "#0a1014"
resource_glyph_outline_outer_width_px = 0
resource_glyph_outline_inner_width_px = 2
resource_glyph_outline_spread = 1.35 # Silhouette offset multiplier (≥0.5)

# Core decor gears (full turn period, ms)
core_gear_outer_ms = 12000 # Clockwise
core_gear_inner_ms = 7000 # Counter-clockwise
core_gear_active_ms = 3500 # Keep spinning after last intake on that core

# Machine clearance (cells)
machine_clearance_min = 1
core_clearance_extra = 2 # Extra gap around the core

# Slot brackets (% of one cell)
slot_input_depth_percent = 22
slot_output_depth_percent = 34
slot_bracket_thick_percent = 18
slot_flow_mark_depth_percent = 12

# Map chunks and economy
chunk_size = 32 # Cells per chunk side
map_chunk_extent = 64 # Max chunk index span per axis
chunk_cost_base = 5 # First purchased chunk
chunk_cost_step = 2 # Added per later purchase
passive_cap = 120 # Time income stops here (12/min fills this in 10 minutes)
wallet_cap = 1000000000 # Absolute balance maximum
coins_per_minute = 12 # Passive coins, including while away, until passive_cap
belt_cost = 1 # Per belt cell
fast_belt_cost = 4 # Per fast belt cell
splitter_cost = 10
trashcan_cost = 8
combiner_cost = 15
tunnel_cost = 6 # Per entrance–exit pair
fast_tunnel_cost = 18 # Per fast pair
satellite_core_count = 2
satellite_core_ring_min = 3
satellite_core_ring_max = 4

# Starter sources and non-starter spawn odds live in elements.toml
# (starter_source_ids + per-base source_spawn_chance_percent).
