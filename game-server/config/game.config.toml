# GNUverse local prototype rules. Durations in ms unless noted. [pipeline] colors are #RRGGBB.
# game:dev hot-reloads [pipeline] on save; invalid edits keep the previous rules.

# Wallet and placement economy
balance_cap = 5 # Max coins in the tower wallet
initial_balance = 5 # Starting coins (cannot exceed balance_cap)
coin_interval_ms = 6000 # Passive +1 coin interval while in a room
action_cooldown_ms = 0 # Min gap between billable placements (0 = none)
default_cost = 1 # Default placement cost when structure omits one
max_cost = 20 # Cap for per-structure costs in code

# Proposals and participation
min_contributions = 3 # Distinct contributors to advance a proposal
ban_duration_ms = 600000 # Moderation ban length

# Prototype and session limits
max_belts = 200 # Belt cells per pipeline room
max_rooms = 200 # Concurrent rooms on this server
session_duration_ms = 604800000 # Room lifetime before expiry
prototype = true # Prototype-only behaviors
bdfl_veto = false # Reserved; must stay false in v0.1

# In-room chat
chat_message_max_length = 280
chat_history_limit = 100 # Messages kept for reconnect
chat_cooldown_ms = 1000 # Min gap between sends per player

# Open Pipeline v0.1 (3×3 source, 5×5 core). grid_width/height apply at room creation only.
[pipeline]

# Simulation
tick_ms = 250 # Authoritative tick interval
source_period_ticks = 4 # Ticks between circle spawns per source
core_demand_circle = 20 # Circle deliveries before next demand tier

# World grid (new rooms)
grid_width = 24
grid_height = 24

# Camera (client)
grid_visible_min_zoom = 0.5 # Show cell grid at or above this zoom (zoomed in)
camera_zoom_min = 0.08 # Zoomed out limit (see more map)
camera_zoom_max = 3 # Zoomed in limit

# Scene palette
color_background = "#0e171d" # Playable floor; void outside chunks
color_grid = "#23343c" # Cell lines when zoomed in
color_belt = "#9eb0b7"
color_belt_chevron = "#6b7d87"
color_packet = "#52d6c9"
color_core = "#ffffff"
color_source = "#52d6c9"
color_accent = "#52d6c9" # Site teal
color_decor = "#1a4542" # Machine decor SVG base (darkened per machine)
decor_darken_percent = 35 # Decor darken amount (0–90)
outline_width_px = 3
color_outline = "#0a1014"
color_surface = "#17252c"
color_muted = "#6a7b83"
color_highlight = "#86e7dd"
color_warning = "#ff8b7d"
color_success = "#5ed4b0"
color_ink = "#293c45" # HUD copy (reserved)
decor_stroke_width = 28 # SVG units; sync with public/pipeline/*.svg

# Belts and animation
belt_chevron_stroke_px = 4
belt_chevron_flow_ms = 900 # Ms to move chevrons one cell

# Resource glyphs at sources
resource_glyph_size_px = 28
resource_glyph_orbit_px = 4
resource_glyph_orbit_ms = 4000

# Machine clearance (cells)
machine_clearance_min = 1
core_clearance_extra = 2 # Extra gap around the core

# Slot brackets (% of one cell)
slot_input_depth_percent = 22
slot_output_depth_percent = 34
slot_bracket_thick_percent = 18
slot_flow_mark_depth_percent = 12

# Map chunks
chunk_size = 32 # Cells per chunk side
map_chunk_extent = 64 # Max chunk index span per axis
chunk_cost_base = 5 # First purchased chunk
chunk_cost_step = 2 # Added per later purchase

# Starter sources and non-starter spawn odds live in elements.toml
# (starter_source_ids + per-base source_spawn_chance_percent).