# Regras ajustáveis do protótipo local do GNUverse.
# Durações usam milissegundos, exceto quando o nome explicita outra unidade.

# Carteira e ritmo (Open Pipeline: +1 a cada 6s, teto 5, saldo inicial 5)
balance_cap = 5
initial_balance = 5
coin_interval_ms = 6000
action_cooldown_ms = 0
default_cost = 1
max_cost = 20

# Propostas e participação
min_contributions = 3
ban_duration_ms = 600000

# Limites do protótipo
max_belts = 200
max_rooms = 200
session_duration_ms = 604800000
prototype = true
bdfl_veto = false

# Open Pipeline v0.1. Source is 3×3; core is 5×5 with 3 inputs per face (12 total).
[pipeline]
tick_ms = 250
grid_width = 24
grid_height = 24
tile_cap = 25
source_period_ticks = 4
color_background = "#0e171d"
color_grid = "#23343c"
color_belt = "#9eb0b7"
color_packet = "#52d6c9"
color_core = "#edf4f4"
color_source = "#edf4f4"
color_accent = "#52d6c9"
decor_stroke_width = 28
machine_clearance_min = 1
core_clearance_extra = 2