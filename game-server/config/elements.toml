# Open Pipeline element recipe book (36 resources, max tier 5).
# Tiers 2–3: 2 inputs → 1 output.
# Tier 4: 3 inputs → 1 output (machine still has 2 out ports in-game).
# Tier 5: 3 inputs → 2 outputs (primary owns the recipe; co-product uses coproduct_of).
# Color families (approx.): cool/blue, warm/red-orange, green/earth-metal.
# See docs/src/game/elements.md and decisions §10.

max_tier = 5

# Core demand chapters. Earlier chapters stay required.
# A crafted demand may only use inputs from this chapter or earlier.
# After chapter 1, each chapter introduces at most one new tier-1 base.
# Orphan basics (nothing else needs them) wait until a late chapter.

[[chapters]]
id = 1
name_pt = "Ignição"
summary_pt = "Duas fontes e uma fórmula. O núcleo só pede água, fogo e vapor."

[[chapters]]
id = 2
name_pt = "Canteiro"
summary_pt = "Entra a grama. Uma fórmula nova (musgo), sem abrir a terra ainda."

[[chapters]]
id = 3
name_pt = "Solo"
summary_pt = "Entra a terra. A linha verde sobe até o broto e para por aí."

[[chapters]]
id = 4
name_pt = "Vento"
summary_pt = "Entra o vento. Névoa, brasa, poeira e nuvem — o resto do tier 2 fica para depois."

[[chapters]]
id = 5
name_pt = "Temporal"
summary_pt = "A cinza só entra agora, porque a tempestade precisa dela."

[[chapters]]
id = 6
name_pt = "Forno"
summary_pt = "Lama, lava e a linha de barro até a fornalha. Nenhuma base nova."

[[chapters]]
id = 7
name_pt = "Mina"
summary_pt = "A última base é o minério. Cristal, liga e as máquinas de tier 4 dessa linha."

[[chapters]]
id = 8
name_pt = "Federação"
summary_pt = "O que sobrou: pólen e jardim (fórmulas antigas) mais os dois pares de tier 5."


