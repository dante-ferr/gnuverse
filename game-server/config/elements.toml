# Open Pipeline element recipe book — fully data-driven.
# Game and preview must read this file (and optional elements/**/*.toml).
# Do not hardcode element ids, chapters, starters, or craft rates in TypeScript.
# See docs/src/game/elements.md and decisions §10.

max_tier = 5
retain_prior_demands = true
default_rate_per_minute = 60
default_source_rate_per_minute = 60
default_productivity = 1
default_glyph_size_px = 28
default_stroke = "#0a1014"
default_demand_required = 20
# Craft quotas grow as ceil(base × escalation_ratio^wave) on each clear. Tier-1 bases stay flat.
escalation_ratio = 1.18
starter_source_ids = ["fire", "water"]
starter_source_ids = ["fire", "water"]

[preview]
node_width = 104
node_height = 52
column_gap = 72
row_gap = 18
highway_lane = 16

[[machines]]
id = "combiner_2"
name_pt = "Combinador"
input_slots = 2
output_slots = 1
coupled_dual_output = true
split_single_across_ports = true
color = "#6eb8c9" # Cool cyan plate (cool family)
decor = "pipeline/combiner-2-decor.svg"
default_rate_per_minute = 60

[[machines]]
id = "combiner_3"
name_pt = "Tri-combinador"
input_slots = 3
output_slots = 2
coupled_dual_output = true
split_single_across_ports = true
color = "#c9a87c" # Warm sand plate (matches splitter family)
decor = "pipeline/combiner-3-decor.svg"
default_rate_per_minute = 60


[[chapters]]
id = 1
name_pt = "Ignição"
summary_pt = "Duas fontes e uma fórmula. O núcleo só pede água, fogo e vapor."
max_new_bases = 2
required_multiplier = 1

[[chapters]]
id = 2
name_pt = "Canteiro"
summary_pt = "Entra a grama. Uma fórmula nova (musgo), sem abrir a terra ainda."
max_new_bases = 1
required_multiplier = 1

[[chapters]]
id = 3
name_pt = "Solo"
summary_pt = "Entra a terra. A linha verde sobe até o broto e para por aí."
max_new_bases = 1
required_multiplier = 1

[[chapters]]
id = 4
name_pt = "Vento"
summary_pt = "Entra o vento. Névoa, brasa, poeira e nuvem — o resto do tier 2 fica para depois."
max_new_bases = 1
required_multiplier = 1

[[chapters]]
id = 5
name_pt = "Temporal"
summary_pt = "A cinza só entra agora, porque a tempestade precisa dela — e a tempestade solta o raio."
max_new_bases = 0
required_multiplier = 1

[[chapters]]
id = 6
name_pt = "Forno"
summary_pt = "Lama, lava e a linha de barro. A fornalha queima a argila e solta o tijolo."
max_new_bases = 0
required_multiplier = 1

[[chapters]]
id = 7
name_pt = "Mina"
summary_pt = "A última base é o minério. Cristal, liga, lente, bateria — e a fundição, que solta sucata."
max_new_bases = 1
required_multiplier = 1

[[chapters]]
id = 8
name_pt = "Federação"
summary_pt = "O que sobrou: pólen e jardim, mais os dois finais. O temporal recolhe o raio; a forja junta tijolo e sucata."
max_new_bases = 0
required_multiplier = 1

