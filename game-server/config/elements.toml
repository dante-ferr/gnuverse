# Open Pipeline element recipe book (design source of truth).
# Replaces nested geometric shapes. Combiners accept 2 distinct inputs → 1 output.
# Tier 1 elements are spawned only by sources. Highest tier is 4.
# UI labels use name_pt. Glyph SVGs (thick outline, simple silhouette) come later.

max_tier = 4
combiner_inputs = 2

# --- Tier 1: bases (sources) -------------------------------------------------

[[elements]]
id = "water"
name_pt = "Água"
tier = 1
color = "#4aa8ff"

[[elements]]
id = "fire"
name_pt = "Fogo"
tier = 1
color = "#ff6b3d"

[[elements]]
id = "grass"
name_pt = "Grama"
tier = 1
color = "#5ecf6a"

[[elements]]
id = "earth"
name_pt = "Terra"
tier = 1
color = "#c4a574"

